{{- if and .Values.workspaceSandbox.enabled (not .Values.workspaceSandbox.existingSecret) }}
{{- /*
HMAC key from which Intel derives each sandbox's RUNTIME_API_TOKEN
(HMAC-SHA256(secret, sandbox-name)). Provide via values or point
workspaceSandbox.existingSecret at a pre-created Secret with the same key.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nh-rag.fullname" . }}-workspace-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nh-rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  WORKSPACE_SANDBOX_TOKEN_SECRET: {{ required "workspaceSandbox.tokenSecret is required when workspaceSandbox.enabled is true (or set workspaceSandbox.existingSecret)" .Values.workspaceSandbox.tokenSecret | quote }}
{{- end }}
