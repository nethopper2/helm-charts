{{- /*
existingSecret validation Job.

Why this exists:
  OI_API_KEY, BENCH_AUTOMATION_ENCRYPTION_KEY, and BENCH_AUTOMATION_RUN_SECRET
  are sourced via secretKeyRef with no `optional` flag, so Kubernetes already
  refuses to start a pod if one of these keys is entirely missing from
  .Values.existingSecret. This Job catches the one case that doesn't: a key
  that's present but set to an empty string.
  SLACK_WEBHOOK_URL is deliberately NOT checked here -- it's a feature toggle
  (optional: true on its secretKeyRef), so an empty/missing value just means
  Slack posting stays off, not a boot failure.

What it does:
  Sources the same secretKeyRef entries the API Deployment uses (via the
  shared "nh-ai-benchmark.secretEnv" partial, so the two can never drift) and
  fails if OI_API_KEY, BENCH_AUTOMATION_ENCRYPTION_KEY, or
  BENCH_AUTOMATION_RUN_SECRET is empty.

Lifecycle:
  - helm.sh/hook: pre-install,pre-upgrade   (Helm path)
  - argocd.argoproj.io/hook: PreSync        (ArgoCD path)
  If this Job fails, the sync stops before any other resource is touched --
  on an upgrade, the currently-running (old, good) pod is never torn down.

No RBAC needed: sourcing env vars via secretKeyRef is done by the kubelet
using node credentials, not the pod's own ServiceAccount -- unlike an
in-container `kubectl get secret`, which would need a Role/RoleBinding.
*/ -}}
{{- if .Values.existingSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nh-ai-benchmark.fullname" . }}-validate-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nh-ai-benchmark.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "nh-ai-benchmark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: validate-secret
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validate-secret
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "nh-ai-benchmark.secretEnv" . | nindent 12 }}
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              missing=""
              for v in OI_API_KEY BENCH_AUTOMATION_ENCRYPTION_KEY BENCH_AUTOMATION_RUN_SECRET; do
                eval "val=\$$v"
                [ -n "$val" ] || missing="$missing $v"
              done
              if [ -n "$missing" ]; then
                echo "existingSecret {{ .Values.existingSecret }} has empty (but present) key(s):$missing"
                exit 1
              fi
              echo "all existingSecret keys present and non-empty"
{{- end }}
