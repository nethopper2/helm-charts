apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "juicefs-s3-gateway.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "juicefs-s3-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.strategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- else if .Values.persistence.enabled }}
  # RWO PVC: maxSurge 0 caps total pods at replicas, so the old pod releases the disk before
  # the new one starts. Assumes replicas: 1, where maxUnavailable 1 is 100%.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "juicefs-s3-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "juicefs-s3-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "juicefs-s3-gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: format
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            {{- if .Values.secret.config.token }}
            - juicefs auth ${name} --token=${token} {{ if .Values.secret.config.bucket }}--bucket=${bucket}{{ end }}
            {{- else }}
            # `juicefs format` does NOT skip on an existing volume: it re-applies every
            # flag passed here on every pod start, and preserves ones that are absent
            # (verified on champagne/dev 2026-08-15). So formatOptions overrides any
            # `juicefs config` change; anything not listed here is volume state.
            # Folded scalar: values are spliced into YAML now that the ConfigMap is gone,
            # and in a plain scalar a ": " would parse the command into a map while a " #"
            # would SILENTLY truncate the rest of the line. Inside >- both are literal.
            - >-
              juicefs format ${metaurl} ${name} --storage=${storage} --bucket=${bucket} {{ .Values.configMap.formatOptions | replace "\n" " " | trim }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "juicefs-s3-gateway.secretName" . }}
          env:
            - name: name
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: name
            - name: bucket
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: bucket
            {{- if .Values.secret.config.token }}
            - name: token
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: token
            {{- else }}
            - name: metaurl
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: metaurl
            - name: storage
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: storage
            {{- end }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: minio-root-password
            {{- if .Values.secret.config.rsaPassphrase }}
            - name: JFS_RSA_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: rsa-passphrase
            {{- end }}
            {{- if eq .Values.secret.config.storage "gs" }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
            {{- end }}
            {{- if contains "postgres" .Values.secret.config.metaurl }}
            - name: META_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresql.auth.existingSecret }}
                  key: {{ .Values.global.postgresql.auth.secretKeys.adminPasswordKey }}
            {{- end }}
            {{- if .Values.initEnvs }}
            {{- toYaml .Values.initEnvs | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.secret.config.token }}
            - mountPath: /root/.juicefs
              name: jfs-root-dir
            {{- end }}
            {{- if .Values.secret.config.rsaKey }}
            - name: rsa-key
              mountPath: "/root"
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.secret.config.storage "gs") .Values.secret.config.credentialsSecret }}
            - name: object-storage-credentials
              mountPath: /var/secrets/google
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.secret.config.storage "s3") .Values.secret.config.credentialsSecret }}
            - name: object-storage-credentials
              mountPath: /root/.aws
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      containers:
        - name: gateway
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            # Cache flags FIRST so configMap.options can still override one deliberately -
            # JuiceFS takes the last occurrence. They are rendered structurally rather than
            # kept in that string because overriding a string REPLACES it, and an env that
            # dropped --cache-dir would send the cache back to the uncapped minio-config
            # volume. Note that raising --cache-size this way past the emptyDir sizeLimit
            # gets the POD evicted; size the cache with cache.emptyDirSizeGi, which moves
            # the flag and the sizeLimit together.
            #
            # Folded scalar: the options are spliced in verbatim now that the ConfigMap is
            # gone, and in a plain scalar a ": " parses the command into a map while a " #"
            # SILENTLY truncates the rest of the line - taking the cache flags with it.
            # Keep each command on ONE physical line: >- folds continuation lines, but a
            # blank or extra-indented one survives as a real newline, which sh would read
            # as a command separator. `replace "\n" " "` covers a multi-line options value.
            {{- if .Values.secret.config.token }}
            - >-
              juicefs gateway ${name} 0.0.0.0:{{ .Values.port }} {{ include "juicefs-s3-gateway.cacheFlags" . }} --buffer-size={{ .Values.bufferSizeMi }} {{ .Values.configMap.options | replace "\n" " " | trim }}{{ if .Values.secret.config.rsaKey }} --rsa-key /root/rsa-key.pem{{ end }}
            {{- else }}
            - >-
              juicefs gateway ${metaurl} 0.0.0.0:{{ .Values.port }} --metrics=0.0.0.0:{{ .Values.metricsPort }} {{ include "juicefs-s3-gateway.cacheFlags" . }} --buffer-size={{ .Values.bufferSizeMi }} {{ .Values.configMap.options | replace "\n" " " | trim }}{{ if .Values.secret.config.rsaKey }} --rsa-key /root/rsa-key.pem{{ end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "juicefs-s3-gateway.secretName" . }}
          env:
            - name: name
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: name
            {{- if .Values.secret.config.token }}
            - name: token
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: token
            {{- else }}
            - name: metaurl
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: metaurl
            {{- end }}
            - name: MINIO_NOTIFY_WEBHOOK_ENABLE_1
              value: "on"
            - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_1
              value: {{ .Values.configMap.webhookEndpoint | quote }}
            {{- if .Values.persistence.enabled }}
            - name: MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_1
              value: "/messages"
            {{- end }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: minio-root-password
            {{- if .Values.secret.config.rsaPassphrase }}
            - name: JFS_RSA_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: rsa-passphrase
            {{- end }}
            {{- if eq .Values.secret.config.storage "gs" }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
            {{- end }}
            {{- if contains "postgres" .Values.secret.config.metaurl }}
            - name: META_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresql.auth.existingSecret }}
                  key: {{ .Values.global.postgresql.auth.secretKeys.adminPasswordKey }}
            {{- end }}
            {{- if .Values.envs }}
            {{- toYaml .Values.envs | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: minio-config
              mountPath: /nonexistent
            - name: tmp
              mountPath: /tmp
            # Without --cache-dir the gateway fell back to $HOME/.juicefs/cache, and
            # $HOME is /nonexistent - i.e. the minio-config volume, which has no sizeLimit.
            - name: juicefs-cache
              mountPath: {{ .Values.cache.dir }}
            {{- if .Values.persistence.enabled }}
            - name: messages
              mountPath: /messages
            {{- end }}
            {{- if .Values.secret.config.token }}
            - mountPath: /root/.juicefs
              name: jfs-root-dir
            {{- end }}
            {{- if .Values.secret.config.rsaKey }}
            - name: rsa-key
              mountPath: "/root"
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.secret.config.storage "gs" ) .Values.secret.config.credentialsSecret }}
            - name: object-storage-credentials
              mountPath: /var/secrets/google
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.secret.config.storage "s3") .Values.secret.config.credentialsSecret }}
            - name: object-storage-credentials
              mountPath: /root/.aws
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.sidecar.enabled }}
        - name: gateway-config
          image: {{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy }}
          env:
            - name: GATEWAY_ENDPOINT
              value: "http://localhost:{{ .Values.port }}"
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: minio-root-user
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: minio-root-password
            - name: BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: name
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for JuiceFS S3 Gateway to be ready..."

              # Wait for gateway to be ready (max 5 minutes)
              TIMEOUT=300
              ELAPSED=0
              INTERVAL=5

              while [ $ELAPSED -lt $TIMEOUT ]; do
                if mc --config-dir /tmp/.mc alias set jfs ${GATEWAY_ENDPOINT} ${ACCESS_KEY} ${SECRET_KEY} 2>/dev/null; then
                  echo "Gateway is ready!"
                  break
                fi
                echo "Gateway not ready yet, waiting ${INTERVAL}s... (${ELAPSED}/${TIMEOUT}s elapsed)"
                sleep ${INTERVAL}
                ELAPSED=$((ELAPSED + INTERVAL))
              done

              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "ERROR: Gateway did not become ready within ${TIMEOUT} seconds"
                exit 1
              fi

              echo "Starting JuiceFS S3 Gateway configuration..."
              {{- range .Values.sidecar.mcCommands }}
              echo "Executing: {{ . }}"
              {{ . }}
              {{- end }}
              echo "Configuration completed successfully!"

              # Keep container running if configured (useful for debugging)
              {{- if .Values.sidecar.keepRunning }}
              echo "Sidecar configured to keep running. Sleeping indefinitely..."
              while true; do sleep 3600; done
              {{- else }}
              echo "Sidecar exiting successfully."
              exit 0
              {{- end }}
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.fuse.enabled }}
        - name: fuse-mount
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.fuse.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Starting JuiceFS FUSE mount..."
              
              # Create mount point directory
              mkdir -p {{ .Values.fuse.mountPath }}
              
              # Mount JuiceFS filesystem with FUSE
              {{- if .Values.secret.config.token }}
              # Same cacheFlags as the gateway - identical values are what make sharing
              # one cache volume between the two clients safe. Same first/last ordering
              # too, so an override behaves the same in both containers.
              exec juicefs mount ${name} {{ .Values.fuse.mountPath }} --metrics=0.0.0.0:9568 {{ include "juicefs-s3-gateway.cacheFlags" . }} --buffer-size={{ .Values.fuse.bufferSizeMi }} {{ .Values.fuse.options }}
              {{- else }}
              exec juicefs mount ${metaurl} {{ .Values.fuse.mountPath }} --metrics=0.0.0.0:9568 {{ include "juicefs-s3-gateway.cacheFlags" . }} --buffer-size={{ .Values.fuse.bufferSizeMi }} {{ .Values.fuse.options }}
              {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "juicefs-s3-gateway.secretName" . }}
          env:
            - name: name
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: name
            {{- if .Values.secret.config.token }}
            - name: token
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: token
            {{- else }}
            - name: metaurl
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: metaurl
            {{- end }}
            {{- if .Values.secret.config.rsaPassphrase }}
            - name: JFS_RSA_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "juicefs-s3-gateway.secretName" . }}
                  key: rsa-passphrase
            {{- end }}
            {{- if eq .Values.secret.config.storage "gs" }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
            {{- end }}
            {{- if contains "postgres" .Values.secret.config.metaurl }}
            - name: META_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresql.auth.existingSecret }}
                  key: {{ .Values.global.postgresql.auth.secretKeys.adminPasswordKey }}
            {{- end }}
          ports:
            - name: fuse-metrics
              containerPort: 9568
              protocol: TCP
          {{- with .Values.fuse.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.fuse.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.fuse.resources | nindent 12 }}
          volumeMounts:
            - name: fuse-mount-point
              mountPath: {{ .Values.fuse.mountPath }}
              # Bidirectional pushes this FUSE mount into the NODE's mount namespace, so
              # it OUTLIVES the process that served it. When `juicefs mount` died on mphr
              # the endpoint stayed behind with no daemon: every stat() on it returned
              # ENOTCONN, containerd stats it while generating the container spec, so the
              # container could never start again (restartCount stuck at 0), and kubelet's
              # own TearDown stats it too, so kubelet could not unmount it either - it
              # retried every 2m2s for 18h. Only a manual `umount -l` on the node cleared it.
              # With None the mount lives and dies with the container's namespace, so the
              # liveness probe can actually recover it. Set this back to Bidirectional only
              # if something OUTSIDE the container needs to see the mount; nothing does today.
              mountPropagation: {{ .Values.fuse.mountPropagation | default "None" }}
            - name: juicefs-cache
              mountPath: {{ .Values.cache.dir }}
            {{- if .Values.secret.config.token }}
            - mountPath: /root/.juicefs
              name: jfs-root-dir
            {{- end }}
            {{- if .Values.secret.config.rsaKey }}
            - name: rsa-key
              mountPath: "/root"
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.secret.config.storage "gs") .Values.secret.config.credentialsSecret }}
            - name: object-storage-credentials
              mountPath: /var/secrets/google
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.secret.config.storage "s3") .Values.secret.config.credentialsSecret }}
            - name: object-storage-credentials
              mountPath: /root/.aws
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      volumes:
        - name: minio-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Shared by the gateway and the fuse client, so it must stay OUTSIDE the
        # fuse.enabled gate below - otherwise disabling the sidecar leaves the gateway
        # mounting a volume that does not exist. sizeLimit is a kubelet backstop that
        # evicts the POD; --cache-size (80% of it) is the cap that should actually bind.
        - name: juicefs-cache
          emptyDir:
            # Unconditional: the cacheFlags helper refuses to render with
            # emptyDirSizeGi < 1, so there is no path to a volume without a sizeLimit.
            sizeLimit: {{ .Values.cache.emptyDirSizeGi }}Gi
        {{- if .Values.persistence.enabled }}
        - name: messages
          persistentVolumeClaim:
            claimName: {{ include "juicefs-s3-gateway.fullname" . }}-messages
        {{- end }}
        {{- if .Values.secret.config.credentialsSecret }}
        - name: object-storage-credentials
          secret:
            secretName: {{ .Values.secret.config.credentialsSecret }}
        {{- end }}
        {{- if .Values.secret.config.token }}
        - emptyDir: {}
          name: jfs-root-dir
        {{- end }}
        {{- if .Values.secret.config.rsaKey }}
        - name: rsa-key
          secret:
            secretName: {{ include "juicefs-s3-gateway.secretName" . }}
            items:
              - key: rsa-key
                path: rsa-key.pem
        {{- end }}
        {{- if .Values.fuse.enabled }}
        - name: fuse-mount-point
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
