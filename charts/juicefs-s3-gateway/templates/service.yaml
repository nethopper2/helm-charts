apiVersion: v1
kind: Service
metadata:
  name: {{ include "juicefs-s3-gateway.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "juicefs-s3-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
      name: http
    - name: http-metrics
      port: {{ .Values.metricsPort }}
      targetPort: {{ .Values.metricsPort }}
    {{- if .Values.fuse.enabled }}
    # The fuse client's own metrics. Previously 9568 was declared as a containerPort and
    # nothing else, so the sidecar was never scraped and there is no history for it - which
    # is why "is anyone using the mount?" could not be answered from Prometheus.
    - name: fuse-metrics
      port: {{ .Values.fuse.metricsPort | default 9568 }}
      targetPort: fuse-metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "juicefs-s3-gateway.selectorLabels" . | nindent 4 }}
