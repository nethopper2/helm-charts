global:
  secretArgocdHook: PreSync


replicaCount: 1

image:
  repository: juicedata/mount
  pullPolicy: IfNotPresent
  # -- Overrides the image tag which defaults to the chart appVersion.
  # For JuiceFS Community Edition, use ce-vx.x.x style tags
  # For JuiceFS Enterprise Edition, use ee-vx.x.x style tags
  # Find the latest built images in our docker image repo: https://hub.docker.com/r/juicedata/mount
  tag: "ce-v1.3.0"

port: 9000
metricsPort: 9567
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Annotations to add to the service account
  annotations: {}
  # -- Whether to automount the service account token
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Set filesystem group
  fsGroup: 65534
  # -- Run as specific user ID
  runAsUser: 65534
  # -- Run as specific group ID
  runAsGroup: 65534

securityContext:
  # -- Drop all capabilities
  capabilities:
    drop:
    - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root
  runAsNonRoot: true
  # -- Run as specific user ID
  runAsUser: 65534
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false

service:
  type: ClusterIP

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 5000m
    memory: 5Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# -- Local block cache. One `juicefs-cache` emptyDir mounted at `dir` in the gateway and,
# when enabled, the fuse sidecar. Both get identical flags from the cacheFlags helper.
cache:
  dir: /var/jfsCache
  # -- Size of the juicefs-cache emptyDir, in GiB. Must be >= 1; there is no
  # "0 = unlimited" and the chart refuses to render if you try it. JuiceFS is told to
  # use 80% of this (--cache-size is derived automatically) and must never reach it:
  # overrunning --cache-size just makes JuiceFS evict cache blocks, but overrunning
  # the volume makes kubelet EVICT THE POD. For a large cache, set a large number.
  emptyDirSizeGi: 20
  # -- Min free space on the NODE disk, not this volume (an emptyDir is a bind mount
  # from it). JuiceFS default 0.1 fills to 90%, which is kubelet's eviction threshold.
  freeSpaceRatio: 0.2
  # -- Evict blocks untouched this long. JuiceFS default "0s" never evicts, so steady
  # state becomes the cap rather than the working set.
  expire: 336h
  # -- Gateway runs as UID 65534, fuse as root; the 0600 default would stop them
  # reading each other's blocks in the shared directory.
  mode: "0660"

# -- Read/write buffer for the GATEWAY client, in MiB (--buffer-size). This is the main
# tunable contributor to RSS: budget roughly 4x it for the memory limit. Floor is
# max-uploads x block-size (20 x 4MiB = 80MiB) or writes stall. 300 is JuiceFS's own
# default, pinned here so it is visible and cannot drift; 4x = ~1.2GiB against a 2Gi limit.
bufferSizeMi: 300

# -- Deployment update strategy. Leave unset and the chart picks Recreate whenever
# persistence is enabled, because the messages PVC is ReadWriteOnce and RollingUpdate
# deadlocks against it (see templates/deployment.yaml). Override only if you know the
# PVC is RWX or persistence is off.
# strategy:
#   type: RollingUpdate
#   rollingUpdate:
#     maxUnavailable: 1
#     maxSurge: 0

# -- Persistence configuration for the messages directory
persistence:
  # -- Enable persistence using PVC
  enabled: false
  # -- PVC Storage Class for messages volume
  # If defined, storageClassName: <storageClass>
  # If set to "-", storageClassName: "", which disables dynamic provisioning
  # If undefined (the default) or set to null, no storageClassName spec is
  # set, choosing the default provisioner
  storageClass: ""
  # -- PVC Access Mode for messages volume
  accessMode: ReadWriteOnce
  # -- PVC Storage Request for messages volume
  size: 1Gi
  # -- Annotations for the PVC
  annotations: {}
  # -- Selector to match an existing Persistent Volume (optional)
  # selector:
  #   matchLabels:
  #     app: my-app
  selector: {}

# -- Liveness probe configuration
livenessProbe: {}
  # httpGet:
  #   path: /
  #   port: http
  # initialDelaySeconds: 30
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 3

# -- Readiness probe configuration
readinessProbe: {}
  # httpGet:
  #   path: /
  #   port: http
  # initialDelaySeconds: 5
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 3

hostNetwork: false
nodeSelector: {}
tolerations: []
affinity: {}

# -- Environment variables for init containers
# Example:
#  - name: GOOGLE_APPLICATION_CREDENTIALS
#    value: "/root/.config/gcloud/application_default_credentials.json"
initEnvs: []

# -- Environment variables for the gateway container
envs: []

# -- Extra volumes for the mount pod, used when JuiceFS Client relies on extra config files
extraVolumes:
  #  - name: ceph-secret
  #    secret:
  #      secretName: ceph-secret
# -- Extra volume mounts for both init containers and main containers
# These volumes will be mounted in both the format init container and gateway container
extraVolumeMounts:
  #  - name: ceph-secret
  #    mountPath: "/etc/ceph"

# -- Secret configuration for JuiceFS
secret:
  # -- Whether to create a new secret or use an existing one
  create: true
  # -- Set to "Skip" to skip the sync of the secret
  sync: "Sync"
  # -- Name of the secret to use. If not specified, a name is generated using the fullname template
  name: ""
  # -- Annotations to add to the created secret
  annotations: {}
  # -- Labels to add to the created secret
  labels: {}
  
  # -- JuiceFS configuration (only used when secret.create is true)
  config:
    # -- Name of the secret to use for credentials
    credentialsSecret: ""
    # -- The JuiceFS file system name
    name: ""
    # -- JuiceFS Enterprise Edition file system token, if this token is specified,
    # this helm chart then assumes JuiceFS EE and neglect all CE configurations
    token: ""
    # -- Connection URL for metadata engine (e.g. Redis)
    # Ref: https://juicefs.com/docs/community/databases_for_metadata
    metaurl: ""
    # -- Object storage type, such as `s3`, `gs`, `oss`
    # Ref: https://juicefs.com/docs/community/how_to_setup_object_storage
    storage: ""
    # -- Object storage bucket or full endpoint
    # CE Ref: https://juicefs.com/docs/community/how_to_setup_object_storage
    # EE Ref (see --bucket): https://juicefs.com/docs/cloud/reference/command_reference/#auth
    bucket: ""
    # NOTE: Authentication is provided via mounted volumes:
    # - S3: Mount AWS credentials to /root/.aws/ (credentials and config files)
    # - GCS: Mount service account key to /var/secrets/google/ and set GOOGLE_APPLICATION_CREDENTIALS
    # -- RSA passphrase for encryption
    rsaPassphrase: ""
    # -- RSA private key for encryption
    # rsaKey: |
    #   -----BEGIN RSA PRIVATE KEY-----
    #   ...
    #   -----END RSA PRIVATE KEY-----
    rsaKey: ""


# -- DEPRECATED NAME. No ConfigMap is created any more - templates/configmap.yaml was
# removed and these values are rendered straight into the pod template instead. The name
# is kept only so the 12 env files in private-ai-releases keep working; rename to
# something honest when you are willing to churn them.
#
# Why it went: a ConfigMap change does not alter the podTemplate, so nothing restarted
# and the new options silently did not apply until an unrelated restart. There was also
# no checksum/config annotation. Inlining means changing options now rolls the pods.
#
# STILL READ:  formatOptions, options, webhookEndpoint
# DEAD:        create, name, annotations, labels  (and the configMapName helper)
configMap:
  # -- DEAD: nothing reads this
  create: true
  # -- DEAD: nothing reads this
  name: ""
  # -- DEAD: nothing reads this
  annotations: {}
  # -- DEAD: nothing reads this
  labels: {}
  # -- JuiceFS format options. Separated by spaces
  # Example: "--inodes=1000000 --block-size=4M"
  # Ref: https://juicefs.com/docs/community/command_reference#format
  formatOptions: "--inodes=1000000 --block-size=4M"
  # -- Gateway Options. Separated by spaces
  # Example: "--get-timeout=60 --put-timeout=60"
  # CE Ref: https://juicefs.com/docs/community/command_reference#gateway
  # EE Ref: https://juicefs.com/docs/cloud/reference/command_reference/#gateway
  # Cache flags are NOT here - see the `cache:` block. They are rendered
  # structurally and appended after this string, so an env that overrides `options`
  # cannot accidentally drop them.
  #
  # Of the five flags below, only three change anything: --get-timeout=60 and
  # --put-timeout=60 are already JuiceFS's own defaults. --keep-etag and --object-meta
  # are off by default, and --refresh-iam-interval defaults to 5m (this is 10x more
  # frequent - reason unknown, inherited).
  options: "--get-timeout=60 --put-timeout=60 --keep-etag --object-meta --refresh-iam-interval=30s"

# -- Metrics configuration
metrics:
  # -- Enable metrics collection
  enabled: false
  # -- ServiceMonitor configuration for Prometheus monitoring
  serviceMonitor:
    # -- Enable ServiceMonitor creation
    enabled: false
    # -- Namespace for the ServiceMonitor (defaults to release namespace)
    namespace: ""
    # -- Port name or number for metrics endpoint
    port: "http-metrics"
    # -- Path for metrics endpoint
    path: "/metrics"
    # -- Scrape interval
    interval: "30s"
    # -- Scrape timeout
    scrapeTimeout: "10s"
    # -- Additional labels for the ServiceMonitor
    additionalLabels: {}
    # -- Annotations for the ServiceMonitor
    annotations: {}
    # -- Relabeling configuration
    relabelings: []
    # -- Metric relabeling configuration
    metricRelabelings: []
    # -- TLS configuration
    tlsConfig: {}

# -- JuiceFS Gateway Configuration Sidecar
# This sidecar container configures the gateway after it becomes ready using MinIO Client (mc)
# The sidecar waits for the gateway to be healthy before executing configuration commands
# Ref: https://juicefs.com/docs/community/guide/gateway/#use-a-webhook-to-publish-events
sidecar:
  # -- Enable the configuration sidecar
  enabled: false
  # -- MinIO Client image and version
  # Using the specific version recommended by JuiceFS documentation for compatibility
  image:
    repository: minio/mc
    tag: RELEASE.2021-04-22T17-40-00Z
    pullPolicy: IfNotPresent
  # -- Resource limits and requests for the sidecar
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  keepRunning: false
  # -- List of mc commands to execute for gateway configuration
  # The following variables are available in command templates:
  # - GATEWAY_ENDPOINT: The gateway endpoint (http://localhost:port)
  # - ACCESS_KEY: From MINIO_ROOT_USER secret
  # - SECRET_KEY: From MINIO_ROOT_PASSWORD secret
  # - BUCKET_NAME: The bucket name
  # Example commands for webhook event notifications:
  # mcCommands:
  #   - mc --config-dir /tmp/.mc event add jfs/${BUCKET_NAME} arn:minio:sqs::1:webhook --event put,delete --ignore-existing
  mcCommands:
    - mc --config-dir /tmp/.mc event add jfs/${BUCKET_NAME} arn:minio:sqs::1:webhook --event put,delete --ignore-existing

# -- JuiceFS FUSE Mount Configuration
# Enables FUSE mount alongside the S3 gateway for extended attributes (xattr) support
# This runs a sidecar container with `juicefs mount` that provides POSIX filesystem access
# WARNING: FUSE mount requires privileged mode which has security implications
# Ref: https://juicefs.com/docs/community/command_reference#mount
fuse:
  # -- Enable FUSE mount sidecar container
  enabled: false
  
  # -- Mount path for the FUSE filesystem inside the container
  mountPath: "/jfs"

  # -- Mount propagation for the FUSE mount. Keep "None" unless something outside this
  # container has to see the mount. "Bidirectional" publishes it to the node, where it
  # survives the process serving it: a dead endpoint then blocks the container from ever
  # restarting AND blocks kubelet from unmounting it (mphr, 18h, 2026-08-17).
  mountPropagation: None
  
  # -- JuiceFS mount options (space-separated)
  # Key flags for extended attributes:
  #   --enable-xattr    Enable extended attributes (REQUIRED for xattr support)
  #   --enable-cap      Enable security.capability xattr
  #   --enable-selinux  Enable security.selinux xattr
  # Cache options:
  #   --cache-size=N    Cache size in MiB (default: 102400 = 100GB)
  #   --cache-dir=PATH  Cache directory path (default: /var/jfsCache)
  # Ref: https://juicefs.com/docs/community/command_reference#mount
  # Cache flags removed - they now come from the top-level `cache:` block and are
  # appended to this command, identically for the gateway and this client.
  options: "--enable-xattr"

  # -- Read/write buffer for THIS client, in MiB. Deliberately below the gateway's 300:
  # nothing reads the mount, so throughput is irrelevant, and 4x128 = ~512MiB keeps the
  # working set inside the 512Mi limit below. Leaving it unset means JuiceFS's 300MiB
  # default against that limit, i.e. ~1.2GiB expected vs 512Mi allowed - which is how
  # mphr's sidecar OOMKilled at exactly 512.0 on two pod generations (2026-08-17), and
  # bowen's has restarted 4 times. Do not go below ~96 (max-uploads x block-size floor).
  bufferSizeMi: 128

  # -- Resource limits and requests for FUSE sidecar container
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  
  # -- Cache configuration for FUSE mount (uses emptyDir)
  # cache: REMOVED - superseded by the top-level `cache:` block, which is shared by the
  # gateway and this sidecar. fuse.cache.emptyDirSize is no longer read.
  
  # -- Security context for FUSE container
  # WARNING: Privileged mode is REQUIRED for FUSE mount operations
  # This gives the container full access to host devices including /dev/fuse
  # Ref: https://juicefs.com/docs/community/how_to_use_on_kubernetes/#mount-juicefs-in-the-container
  securityContext:
    privileged: true
  
  # -- Liveness probe for FUSE mount
  # Checks if the mount point is accessible
  livenessProbe:
    exec:
      command:
        - sh
        - -c
        - "ls /jfs > /dev/null 2>&1"
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  
  # -- Readiness probe for FUSE mount
  readinessProbe:
    exec:
      command:
        - sh
        - -c
        - "ls /jfs > /dev/null 2>&1"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
