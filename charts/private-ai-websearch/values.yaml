# Default values for private-ai-websearch.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Pre-created Secret with keys SEARXNG_SECRET and CRAWL4AI_API_TOKEN.
# Required; the chart never creates it.
secretName: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

searxng:
  replicaCount: 1
  image:
    repository: searxng/searxng
    pullPolicy: IfNotPresent
    tag: "2026.8.17-374939b88"
  service:
    type: ClusterIP
    port: 8080
  # SEARXNG_BASE_URL. Only set if SearXNG is exposed externally.
  baseUrl: ""
  # Mounted at /etc/searxng/settings.yml. search.formats must keep `json`
  # (else 403) and server.limiter must stay false (else 429).
  settings: |
    use_default_settings: true

    general:
      instance_name: "Private AI Search"
      enable_metrics: false

    server:
      limiter: false
      public_instance: false
      image_proxy: false

    search:
      formats:
        - html
        - json
      safe_search: 1
      autocomplete: ""
      default_lang: "en"

    outgoing:
      request_timeout: 6.0
      max_request_timeout: 10.0
      pool_connections: 100
      pool_maxsize: 20
  # The startup probe owns the cold start, so liveness and readiness need no
  # initialDelaySeconds. Liveness is deliberately slacker than readiness so a
  # slow instance leaves the Service and gets a chance to recover instead of
  # being restarted underneath you.
  startupProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24
  readinessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5
  extraEnvVars: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

crawl4ai:
  replicaCount: 1
  image:
    repository: unclecode/crawl4ai
    pullPolicy: IfNotPresent
    tag: "0.9.2"
  service:
    type: ClusterIP
    port: 11235
  # /dev/shm size. Chromium crashes on the 64Mi container default.
  # The tmpfs pages are charged to the container's memory cgroup, so this is
  # spent *from* resources.limits.memory below, not on top of it -- raise both
  # together.
  shmSize: 1Gi
  # Chromium is slow to come up, hence the long startup budget; same
  # liveness-slacker-than-readiness rule as searxng above, so heavy crawl load
  # parks the pod rather than restarting it. The explicit timeouts replace the
  # 1s default, far too tight under real load.
  startupProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  extraEnvVars: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  # Headless Chromium; tune against real crawl load.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
