---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "private-ai-websearch.searxng.fullname" . }}
  labels:
    {{- include "private-ai-websearch.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  replicas: {{ .Values.searxng.replicaCount }}
  selector:
    matchLabels:
      {{- include "private-ai-websearch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: searxng
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/searxng-config.yaml") . | sha256sum }}
        {{- with .Values.searxng.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "private-ai-websearch.labels" . | nindent 8 }}
        app.kubernetes.io/component: searxng
        {{- with .Values.searxng.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "private-ai-websearch.serviceAccountName" . }}
      {{- with .Values.searxng.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: searxng
          {{- with .Values.searxng.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.searxng.image.repository }}:{{ .Values.searxng.image.tag }}"
          imagePullPolicy: {{ .Values.searxng.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.searxng.startupProbe.enabled }}
          startupProbe:
            {{- toYaml (omit .Values.searxng.startupProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.searxng.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.searxng.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.searxng.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.searxng.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- with .Values.searxng.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SEARXNG_BASE_URL
              value: {{ .Values.searxng.baseUrl | default (printf "%s/" (include "private-ai-websearch.searxng.url" .)) | quote }}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "private-ai-websearch.secretName" . }}
                  key: SEARXNG_SECRET
            {{- with .Values.searxng.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # subPath so the rest of /etc/searxng stays writable for the entrypoint
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
            - name: cache
              mountPath: /var/cache/searxng
      volumes:
        - name: settings
          configMap:
            name: {{ include "private-ai-websearch.searxng.fullname" . }}
        - name: cache
          emptyDir: {}
      {{- with .Values.searxng.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.searxng.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.searxng.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "private-ai-websearch.searxng.fullname" . }}
  labels:
    {{- include "private-ai-websearch.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  type: {{ .Values.searxng.service.type }}
  ports:
    - port: {{ .Values.searxng.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "private-ai-websearch.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
